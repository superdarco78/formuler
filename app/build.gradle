plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uk.okok.studiokanalow'
    compileSdk 34

    defaultConfig {
        applicationId "uk.okok.studiokanalow"
        minSdk 21
        targetSdk 34
        versionCode 59
        versionName "3.38"
    }

    signingConfigs {
        stala {
            // Staly klucz podpisu - wszystkie wersje maja ten sam podpis,
            // dzieki czemu aktualizacje instaluja sie bez bledu "Nie zainstalowano".
            storeFile file("studio.keystore")
            storePassword "studio123"
            keyAlias "studio"
            keyPassword "studio123"
        }
    }

    buildTypes {
        debug {
            // Cegla 1: bez obfuskacji, zeby najpierw potwierdzic, ze apka dziala.
            // Pancerz (obfuskacja) wlaczymy w kolejnym kroku.
            minifyEnabled false
            signingConfig signingConfigs.stala
        }
        release {
            // Wersja wydana (nie debug) - mniej ostrzezen Play Protect.
            // Obfuskacje wlaczymy pozniej, gdy apka bedzie dopracowana.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.stala
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
