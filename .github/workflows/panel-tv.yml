# Panel TV - buduje APK (debug) i publikuje go jako wydanie "panel-tv-latest" (pobiera go Home Assistant)
name: Panel TV APK
on:
  push:
    paths: ['panel-tv/**', '.github/workflows/panel-tv.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Budowanie
        run: gradle -p panel-tv assembleDebug --no-daemon
      - name: Nazwa pliku
        run: cp panel-tv/app/build/outputs/apk/debug/app-debug.apk PanelTV.apk
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-tv-latest
          name: Panel TV (najnowszy)
          prerelease: true
          files: PanelTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PanelTV
          path: PanelTV.apk
