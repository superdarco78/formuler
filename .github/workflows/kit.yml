name: kit-canva
on:
  push:
    branches: [kit-canva]
permissions:
  contents: write
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - name: Zasoby media3-ui
        run: |
          curl -sSfL -o ui.aar https://dl.google.com/android/maven2/androidx/media3/media3-ui/1.3.1/media3-ui-1.3.1.aar
          unzip -p ui.aar res/values/values.xml | grep -n "styled_controls\|name=\"ExoStyledControls.Button.Center\|RewWithAmount\|exo_icon_size\|exo_styled_controls_button_size\|center_button" | head -80
          unzip -p ui.aar res/values/values.xml | grep -n "ExoStyledControls.Button.Center" -A8 | head -60
