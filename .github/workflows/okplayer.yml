name: Budowa APK (OK Player - nowa)

on:
  push:
    branches: [ main ]
    paths: [ 'okplayer/**', '.github/workflows/okplayer.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wydanie-okplayer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wrapper Gradle
        run: gradle wrapper --gradle-version 8.7
      - name: Prywatny klucz podpisu (jesli dodany w ustawieniach GitHuba)
        env:
          KLUCZ_APK: ${{ secrets.KLUCZ_APK }}
        run: |
          if [ -n "$KLUCZ_APK" ]; then echo "$KLUCZ_APK" | base64 -d > "$RUNNER_TEMP/okplayer.jks"; echo "KLUCZ_PLIK=$RUNNER_TEMP/okplayer.jks" >> "$GITHUB_ENV"; echo "Podpis: klucz prywatny"; else echo "Podpis: stary klucz"; fi
      - name: Zbuduj OK Player
        env:
          HASLO_APK: ${{ secrets.HASLO_APK }}
        run: ./gradlew :okplayer:assembleRelease --no-daemon --stacktrace
      - name: Przygotuj pliki
        run: |
          mkdir -p dist
          cp okplayer/build/outputs/apk/release/okplayer-release.apk dist/okplayer.apk
          VC=$(grep -m1 'versionCode' okplayer/build.gradle | grep -o '[0-9]\+')
          VN=$(grep -m1 'versionName' okplayer/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          python3 -c "import json,sys; json.dump({'versionCode': int(sys.argv[1]), 'versionName': sys.argv[2], 'url': 'https://github.com/superdarco78/formuler/releases/download/okplayer-latest/okplayer.apk', 'zmiany': open('okplayer/zmiany.txt', encoding='utf-8').read().strip() if __import__('os').path.exists('okplayer/zmiany.txt') else ''}, open('dist/wersja.json', 'w', encoding='utf-8'), ensure_ascii=False)" "$VC" "$VN"
          cat dist/wersja.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: okplayer-latest
          name: OK Player (nowa) - najnowszy APK
          files: |
            dist/okplayer.apk
            dist/wersja.json
