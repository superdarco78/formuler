name: Budowa APK (Studio Kanalow TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# Budowy po kolei - zeby dwie wersje naraz nie nadpisywaly sobie pliku APK i wersja.json.
concurrency:
  group: wydanie-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Wygeneruj wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Zbuduj APK (release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Przygotuj pliki
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/studio-kanalow-tv.apk
          VC=$(grep -m1 'versionCode' app/build.gradle | grep -o '[0-9]\+')
          VN=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "{\"versionCode\": $VC, \"versionName\": \"$VN\", \"url\": \"https://github.com/superdarco78/formuler/releases/download/apk-latest/studio-kanalow-tv.apk\"}" > dist/wersja.json
          cat dist/wersja.json

      - name: Wyslij jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: studio-kanalow-tv-apk
          path: dist/studio-kanalow-tv.apk

      - name: Opublikuj do pobrania (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Studio Kanalow TV - najnowszy APK
          files: |
            dist/studio-kanalow-tv.apk
            dist/wersja.json
