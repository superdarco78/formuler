plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// OK Player - NOWA aplikacja napisana od zera (etap 1: logowanie kodem, Start, kanaly, odtwarzacz).
android {
    namespace 'uk.okok.okplayer'
    compileSdk 34

    defaultConfig {
        applicationId "uk.okok.okplayer"
        minSdk 26
        targetSdk 34
        versionCode 42
        versionName "1.41"
    }

    signingConfigs {
        stala {
            storeFile file("../app/studio.keystore")
            storePassword "studio123"
            keyAlias "studio"
            keyPassword "studio123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stala
        }
        debug { signingConfig signingConfigs.stala }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
