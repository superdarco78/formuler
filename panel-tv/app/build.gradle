plugins { id 'com.android.application' }
android {
    namespace 'pl.superdarco.paneltv'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.superdarco.paneltv'
        minSdk 26
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }
    signingConfigs { stala { storeFile file('panel.keystore'); storePassword 'paneltv'; keyAlias 'panel'; keyPassword 'paneltv' } }
    buildTypes { debug { signingConfig signingConfigs.stala } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
